name: Validate cloud-init project
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: python3 configure.py validate
      - run: python3 -m unittest discover -s tests -v
      - run: |
          for f in ./*.sh bootstrap/*.sh tools/*.sh; do
            bash -n "$f"
          done
